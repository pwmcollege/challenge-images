<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Geosint</title>
        <link
            rel="stylesheet"
            href="{{ asset('vendor/leaflet/leaflet.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ asset('vendor/maplibre/maplibre-gl.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ asset('vendor/pannellum/pannellum.css') }}"
        />
        <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
    </head>
    <body>
        <div id="stage">
            <div id="pano" aria-label="360 degree panorama"></div>

            <div class="pano-controls">
                <div class="pair">
                    <button
                        id="btn-pano-in"
                        class="glyph"
                        title="Zoom in"
                        aria-label="Zoom in"
                    >
                        <i data-lucide="plus" aria-hidden="true"></i>
                    </button>
                    <button
                        id="btn-pano-out"
                        class="glyph"
                        title="Zoom out"
                        aria-label="Zoom out"
                    >
                        <i data-lucide="minus" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <header id="hud" hidden>
                <span class="chip" id="pill-threshold">
                    <i data-lucide="target" aria-hidden="true"></i
                    ><span>within - km</span>
                </span>
            </header>

            <div id="loader" role="status" aria-live="polite">
                <div class="loader-panel">
                    <div class="loader-spinner" aria-hidden="true"></div>
                    <div class="loader-lines">
                        <div class="loader-title" id="loader-title">
                            Loading imagery
                        </div>
                        <div class="loader-detail" id="loader-detail">
                            Starting
                        </div>
                    </div>
                </div>
                <div class="loader-track">
                    <div class="loader-bar" id="loader-bar"></div>
                </div>
            </div>

            <div id="toast" role="status" aria-live="polite"></div>

            <section id="mapdock" aria-label="Guess map">
                <div id="map">
                    <div class="map-controls left">
                        <button
                            id="btn-expand"
                            class="glyph"
                            aria-pressed="false"
                            title="Expand map"
                            aria-label="Expand map"
                        >
                            <i data-lucide="maximize-2" aria-hidden="true"></i>
                        </button>
                        <button
                            id="btn-coord"
                            class="glyph"
                            aria-pressed="false"
                            aria-controls="coord-entry"
                            title="Enter coordinates"
                            aria-label="Enter coordinates"
                        >
                            <i
                                data-lucide="locate-fixed"
                                aria-hidden="true"
                            ></i>
                        </button>
                        <button
                            id="btn-map-hide"
                            class="glyph"
                            title="Hide map"
                            aria-label="Hide map"
                        >
                            <i
                                data-lucide="chevron-down"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </div>
                    <div class="map-controls">
                        <div class="pair">
                            <button
                                id="btn-zoom-in"
                                class="glyph"
                                title="Zoom in"
                                aria-label="Zoom in"
                            >
                                <i data-lucide="plus" aria-hidden="true"></i>
                            </button>
                            <button
                                id="btn-zoom-out"
                                class="glyph"
                                title="Zoom out"
                                aria-label="Zoom out"
                            >
                                <i data-lucide="minus" aria-hidden="true"></i>
                            </button>
                        </div>
                        <button
                            id="btn-reset"
                            class="glyph"
                            title="Clear pin and recentre"
                            aria-label="Clear pin and recentre"
                        >
                            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="coord-entry" id="coord-entry" hidden>
                        <input
                            id="coord-input"
                            type="text"
                            inputmode="decimal"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="13.37, 6.21 &nbsp;·&nbsp; 13°37&prime;N 6°21&prime;E"
                            aria-label="Place the pin at coordinates"
                        />
                        <button
                            id="btn-coord-apply"
                            class="glyph bare"
                            title="Place the pin"
                            aria-label="Place the pin"
                            disabled
                        >
                            <i
                                data-lucide="corner-down-left"
                                aria-hidden="true"
                            ></i>
                        </button>
                    </div>
                </div>
                <button id="btn-guess" class="primary" disabled>
                    <i data-lucide="map-pin" aria-hidden="true"></i
                    ><span>Drop a pin</span>
                </button>
            </section>

            <div id="curtain" hidden>
                <div
                    class="card"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="result-title"
                >
                    <div id="result-map"></div>
                    <div class="result-body">
                        <div class="result-head">
                            <span class="result-badge" aria-hidden="true">
                                <i data-lucide="check" aria-hidden="true"></i>
                            </span>
                            <div class="result-lines">
                                <h2 id="result-title">Found it</h2>
                                <p id="result-distance"></p>
                            </div>
                        </div>
                        <div class="field" id="flag-field" hidden>
                            <div class="field-row">
                                <code id="flag-box"></code>
                                <button
                                    id="btn-copy"
                                    class="glyph bare"
                                    title="Copy"
                                    aria-label="Copy flag"
                                >
                                    <i
                                        data-lucide="copy"
                                        aria-hidden="true"
                                    ></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="result-actions">
                        <button id="btn-next" class="primary">Done</button>
                    </div>
                </div>
            </div>

            <button
                id="btn-map-show"
                class="glyph"
                hidden
                title="Show map"
                aria-label="Show map"
            >
                <i data-lucide="map" aria-hidden="true"></i>
            </button>

            <div id="scrim" aria-hidden="true">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <footer id="credits">
                Basemap &copy; CARTO &middot; &copy; OpenStreetMap contributors
                (ODbL) &middot; MapLibre (BSD-3) &middot; Leaflet (BSD-2)
                &middot; Pannellum (MIT) &middot; Lucide (ISC)
            </footer>
        </div>

        <script src="{{ asset('vendor/leaflet/leaflet.js') }}"></script>
        <script src="{{ asset('vendor/maplibre/maplibre-gl.js') }}"></script>
        <script src="{{ asset('vendor/pannellum/pannellum.js') }}"></script>
        <script src="{{ asset('vendor/lucide/lucide.min.js') }}"></script>
        <script src="{{ asset('js/script.js') }}"></script>
    </body>
</html>
