name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image:
        type: choice
        description: Image to build and push
        options:
          - capabilities
          - cve-2021-3156
          - cve-2023-22809
          - cve-2025-32463
          - cve-2025-59825
          - cve-2025-66478
          - cve-2026-24061
          - cve-2026-31431
          - geosint
          - lecture
          - sudo
          - suid
          - web

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - capabilities
          - cve-2021-3156
          - cve-2023-22809
          - cve-2025-32463
          - cve-2025-59825
          - cve-2025-66478
          - cve-2026-24061
          - cve-2026-31431
          - geosint
          - lecture
          - sudo
          - suid
          - web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if image should be updated
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.image }}" == "${{ matrix.image }}" ]; then
              echo "update=true" >> $GITHUB_OUTPUT
              echo "Manually triggered build and push for ${{ matrix.image }}."
            else
              echo "update=false" >> $GITHUB_OUTPUT
              echo "Manual trigger selected ${{ github.event.inputs.image }}, skipping ${{ matrix.image }}."
            fi
          else
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA=$(git hash-object -w -t tree /dev/null)
            elif [ -z "$BEFORE_SHA" ]; then
              echo "::error::Missing previous commit; cannot determine which images changed."
              exit 1
            elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || {
                echo "::error::Cannot fetch the previous commit; skipping image builds."
                exit 1
              }
            fi

            changed=$(git diff --name-only "$BEFORE_SHA" HEAD -- "${{ matrix.image }}" bash.bashrc) || exit 1
            if [ -n "$changed" ]; then
              echo "update=true" >> $GITHUB_OUTPUT
              echo "Changes detected in ${{ matrix.image }}, building and pushing."
            else
              echo "update=false" >> $GITHUB_OUTPUT
              echo "No changes detected in ${{ matrix.image }}, skipping."
            fi
          fi

      - name: Login to Docker Hub
        if: steps.check.outputs.update == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free disk space
        if: steps.check.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h

          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup || true
          sudo docker system prune -af || true

          df -h

      - name: Set up Docker Buildx
        if: steps.check.outputs.update == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Copy bash.bashrc into image context
        if: steps.check.outputs.update == 'true'
        run: |
          cp bash.bashrc ${{ matrix.image }}/

      - name: Build and push Docker image
        if: steps.check.outputs.update == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: pwmcollege/challenge-${{ matrix.image }}:latest
